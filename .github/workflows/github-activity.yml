name: Refresh GitHub activity

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-github-activity.py"
      - ".github/workflows/github-activity.yml"

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch activity snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIVITY_USER: JaderGabriel
        run: python3 scripts/fetch-github-activity.py

      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-activity.json
          if git diff --staged --quiet; then
            echo "No activity changes."
            exit 0
          fi
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
